<style>
:root{--ink:#120d0e;--cream:#f3ece4;--mute:#b9aaa3;--line:rgba(243,236,228,.18);--chip:rgba(18,13,14,.6);--leaf:#46c26a;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);overflow:hidden}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 14px}
.brand{font:400 26px/1 var(--mark);margin-right:4px}
nav{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--cream);font:500 14px var(--sans);padding:8px 14px;border-radius:99px;backdrop-filter:blur(8px);cursor:pointer}
.chip[aria-current=true]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
main{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.sc{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(36px + env(safe-area-inset-bottom,0px));overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(70% 55% at 70% 32%,var(--c) 0%,transparent 70%),linear-gradient(180deg,transparent 40%,var(--ink) 92%)}
.photo{position:absolute;left:50%;top:24%;width:min(66vw,340px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:24px}
.txt{position:relative;max-width:520px}
h2{font:600 clamp(34px,10vw,52px)/1.02 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.d{margin:0 0 10px;color:var(--mute);line-height:1.5;font-size:16px;max-width:42ch}
.nt{margin:0 0 14px;color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.price{font:500 17px var(--sans);border:1px solid var(--line);border-radius:12px;padding:8px 13px;background:var(--chip)}
.tag{font-size:13px;color:var(--mute)}
.leaf{display:inline-block;width:12px;height:12px;margin-right:6px;background:var(--leaf);border-radius:0 100% 0 100%}
.heart{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--cream);font-size:20px;cursor:pointer}
.heart[aria-pressed=true]{background:var(--cream);color:#b3243b}
.lst{position:relative;width:100%;max-width:560px;margin:0 auto;height:100%;overflow-y:auto;padding:84px 0 8px;scrollbar-width:none}
.lst h2{margin-bottom:14px}
.lst h3{font:600 22px/1.1 var(--serif);margin:22px 0 4px}
.sn{margin:0 0 6px;color:var(--mute);font-size:13px}
.it{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.it span:last-child{flex:none;font-weight:500;white-space:nowrap}
.ft{margin:26px 0 0;color:var(--mute);font-size:12px;line-height:1.5}
.ft a{color:var(--cream)}
button:focus-visible,a:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
</style>

document.getElementById("lang").addEventListener("click",function(){L=L==="pt"?"en":"pt";var y=main.scrollTop;render();main.scrollTop=y});
render();
</script>
</body>
</html>
